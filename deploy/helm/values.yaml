image:
  repository: ghcr.io/peoneer/self-hosted-vault-sync-server
  tag: "latest"

# This chart does not create the auth-token secret for you. Create it
# yourself before installing, then point auth.existingSecret at its name:
#
#   kubectl create secret generic vault-sync-auth \
#     --from-literal=authToken=<bootstrap-token-from-first-run-logs>
auth:
  existingSecret: vault-sync-auth
  existingSecretKey: authToken

# Optional admin web UI at /admin (list of tokens + activity log, token
# revocation). Disabled unless admin.existingSecret is set. Create a secret
# with a long random value, separate from the device tokens:
#
#   kubectl create secret generic vault-sync-admin \
#     --from-literal=adminToken=$(openssl rand -hex 24)
admin:
  existingSecret: ""
  existingSecretKey: adminToken

# Take the client IP in the activity log from X-Forwarded-For. Only enable
# if your ingress overwrites (not passes through) that header.
trustProxyHeaders: "false"

ingress:
  enabled: false
  className: nginx
  host: "sync.example.com"
  tls:
    enabled: false
    secretName: vault-sync-tls
    # Only used if tls.enabled — e.g. letsencrypt-prod with cert-manager.
    clusterIssuer: ""

pvc:
  size: 5Gi
  # Leave empty to use your cluster's default StorageClass.
  storageClass: ""
